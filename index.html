<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Muscu Plan — 16 semaines</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F5F4F0;
    --surface:#FFFFFF;
    --surface-2:#EFEEE9;
    --ink:#15171B;
    --ink-dim:#8A8D93;
    --line:rgba(21,23,27,0.08);
    --accent:#C6F24E;
    --accent-ink:#3F6212;
    --ok-bg:#DFF3D2;
    --ok-ink:#2F9E58;
    --warn-bg:#FFF1CE;
    --warn-ink:#A66A00;
    --bad-bg:#FFE1DA;
    --bad-ink:#D8432B;
    --shadow:0 2px 14px rgba(21,23,27,0.06), 0 1px 2px rgba(21,23,27,0.05);
    --r-lg:24px;
    --r-md:18px;
    --r-sm:12px;
    --r-pill:999px;
    font-size:16px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
    font-family:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
  body{padding-bottom:104px;min-height:100vh;}
  .wrap{max-width:560px;margin:0 auto;padding:22px 14px 8px;}

  .icon{display:block;}
  svg.icon{overflow:visible;}

  .card{background:var(--surface);border-radius:var(--r-lg);padding:18px;margin-bottom:14px;box-shadow:var(--shadow);}
  .card h2{font-size:1.02rem;margin:0 0 10px;font-weight:800;display:flex;align-items:center;gap:7px;}
  .card h2 svg{width:18px;height:18px;flex-shrink:0;}
  .muted{color:var(--ink-dim);font-size:0.85rem;}

  /* programme */
  .block-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
  .block-eyebrow{font-size:0.68rem;font-weight:800;letter-spacing:0.04em;color:var(--ink-dim);text-transform:uppercase;margin-bottom:3px;}
  .block-top h2{margin:0;font-size:1.08rem;font-weight:800;}
  .status-pill{font-size:0.68rem;font-weight:800;padding:5px 11px;border-radius:var(--r-pill);white-space:nowrap;}
  .status-active{background:var(--accent);color:var(--accent-ink);}
  .status-done{background:var(--ink);color:#fff;}
  .status-upcoming{background:var(--surface-2);color:var(--ink-dim);}
  .block-progress{height:6px;border-radius:var(--r-pill);background:var(--surface-2);margin:12px 0 14px;overflow:hidden;}
  .block-progress-fill{height:100%;background:var(--accent);border-radius:var(--r-pill);}
  .session-rows{display:flex;flex-direction:column;gap:10px;}
  .session-row{display:flex;align-items:center;gap:12px;padding-top:10px;border-top:1px solid var(--line);}
  .session-row:first-child{padding-top:0;border-top:none;}
  .session-icon{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;
    flex-shrink:0;}
  .session-icon svg{width:19px;height:19px;}
  .session-row-title{font-weight:700;font-size:0.88rem;}
  .session-row-sub{font-size:0.75rem;color:var(--ink-dim);margin-top:1px;line-height:1.35;}

  /* séance */
  .segmented{display:flex;background:var(--surface-2);border-radius:var(--r-pill);padding:5px;gap:4px;margin-bottom:16px;}
  .seg-btn{flex:1;border:none;background:transparent;border-radius:var(--r-pill);padding:10px 4px;
    font-size:0.76rem;font-weight:700;color:var(--ink-dim);display:flex;flex-direction:column;
    align-items:center;gap:4px;cursor:pointer;font-family:inherit;}
  .seg-btn .seg-ic svg{width:18px;height:18px;}
  .seg-btn.active{background:var(--ink);color:#fff;box-shadow:var(--shadow);}

  .warn-banner{background:var(--warn-bg);color:var(--warn-ink);border-radius:var(--r-md);
    padding:12px 14px;font-size:0.82rem;font-weight:600;margin-bottom:14px;line-height:1.4;
    display:flex;align-items:flex-start;gap:9px;}
  .warn-banner svg{width:18px;height:18px;flex-shrink:0;margin-top:1px;}

  .exercise{background:var(--surface);border-radius:var(--r-lg);padding:16px;margin-bottom:12px;box-shadow:var(--shadow);}
  .exercise.done{opacity:0.6;}
  .ex-head{display:flex;align-items:flex-start;gap:12px;}
  .ex-icon{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;
    flex-shrink:0;}
  .ex-icon svg{width:19px;height:19px;}
  .ex-info{flex:1;}
  .ex-name{font-weight:800;font-size:1rem;}
  .ex-group{color:var(--ink-dim);font-size:0.76rem;margin-top:1px;}
  .ex-check{width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--accent-ink);
    display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .ex-check svg{width:13px;height:13px;}
  .ex-target-row{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap;}
  .ex-target-badge{display:inline-flex;align-items:center;gap:6px;background:var(--surface-2);color:var(--ink);
    font-weight:700;font-size:0.78rem;padding:6px 12px;border-radius:var(--r-pill);border:none;
    cursor:default;font-family:inherit;}
  .ex-target-badge svg{width:14px;height:14px;flex-shrink:0;}
  button.ex-target-badge{cursor:pointer;}
  button.ex-target-badge:disabled{opacity:0.5;cursor:default;}
  .set-row{display:flex;align-items:center;gap:10px;margin-top:12px;flex-wrap:wrap;}
  .set-dots{display:flex;gap:7px;flex:1;flex-wrap:wrap;}
  .dot{width:30px;height:30px;border-radius:50%;background:var(--surface);border:2px solid var(--line);
    display:flex;align-items:center;justify-content:center;font-size:0.72rem;font-weight:700;
    color:var(--ink-dim);cursor:pointer;user-select:none;flex-shrink:0;}
  .dot.filled{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);}
  .timer-btn{background:var(--ink);border:none;color:#fff;border-radius:var(--r-pill);padding:9px 14px;
    font-size:0.8rem;font-weight:700;cursor:pointer;white-space:nowrap;font-family:inherit;
    display:inline-flex;align-items:center;gap:7px;}
  .timer-btn svg{width:14px;height:14px;flex-shrink:0;}
  .timer-btn:disabled{opacity:0.5;}
  .diff-row{display:flex;gap:8px;margin-top:12px;}
  .diff-btn{flex:1;border:none;border-radius:var(--r-pill);padding:10px 4px;font-size:0.74rem;
    cursor:pointer;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:4px;font-family:inherit;}
  .diff-btn .diff-ic svg{width:18px;height:18px;}
  .diff-facile{background:var(--ok-bg);color:var(--ok-ink);}
  .diff-parfait{background:var(--warn-bg);color:var(--warn-ink);}
  .diff-dur{background:var(--bad-bg);color:var(--bad-ink);}
  .diff-btn.picked{box-shadow:inset 0 0 0 2px currentColor;}

  .finish-btn{width:100%;background:var(--ink);border:none;color:#fff;font-weight:800;padding:16px;
    border-radius:var(--r-pill);font-size:0.95rem;cursor:pointer;margin-top:6px;font-family:inherit;
    display:flex;align-items:center;justify-content:center;gap:8px;}
  .finish-btn svg{width:17px;height:17px;}
  .finish-btn:disabled{background:var(--surface-2);color:var(--ink-dim);cursor:not-allowed;}

  /* progression */
  .stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
  .hero-stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:14px;}
  .hero-stats .stat-card{padding:12px 10px;}
  .hero-stats .stat-ic{width:28px;height:28px;margin-bottom:8px;}
  .hero-stats .stat-ic svg{width:14px;height:14px;}
  .hero-stats .stat-num{font-size:1.05rem;}
  .hero-stats .stat-lbl{font-size:0.66rem;line-height:1.3;}
  .stat-card{background:var(--surface);border-radius:var(--r-lg);padding:16px;box-shadow:var(--shadow);}
  .stat-ic{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;
    margin-bottom:10px;}
  .stat-ic svg{width:17px;height:17px;}
  .stat-num{font-size:1.3rem;font-weight:800;letter-spacing:-0.01em;}
  .stat-lbl{font-size:0.72rem;color:var(--ink-dim);font-weight:600;margin-top:2px;}

  .bars{display:flex;align-items:flex-end;gap:8px;height:120px;margin:14px 0 4px;padding-top:22px;}
  .bar-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;
    height:100%;position:relative;}
  .bar-count{font-size:0.62rem;font-weight:800;color:var(--ink-dim);margin-bottom:4px;height:12px;}
  .bar-col.current .bar-count{color:var(--ink);}
  .bar{width:100%;max-width:26px;border-radius:8px 8px 4px 4px;background:var(--surface-2);min-height:5px;}
  .bar.has-sessions{background:var(--accent);}
  .bar-col.current .bar.has-sessions{background:var(--ink);}
  .bar-lbl{font-size:0.62rem;color:var(--ink-dim);margin-top:6px;font-weight:600;}

  .hist-item{display:flex;align-items:center;gap:9px;padding:10px 0;border-top:1px solid var(--line);font-size:0.82rem;}
  .hist-item:first-child{border-top:none;}
  .hist-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
  .hist-item .d1{color:var(--ink-dim);font-weight:600;font-size:0.76rem;min-width:78px;}
  .hist-item .d2{font-weight:600;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .hist-diffs{display:inline-flex;gap:3px;}
  .hist-diffs svg{width:13px;height:13px;}

  nav.bottom{position:fixed;bottom:14px;left:14px;right:14px;max-width:532px;margin:0 auto;
    background:var(--surface);border-radius:var(--r-pill);box-shadow:var(--shadow);
    display:flex;padding:6px;z-index:50;}
  nav.bottom button{flex:1;background:none;border:none;color:var(--ink-dim);padding:10px 4px;
    font-size:0.68rem;font-weight:700;border-radius:var(--r-pill);display:flex;flex-direction:column;
    align-items:center;gap:4px;cursor:pointer;font-family:inherit;}
  nav.bottom button .ic svg{width:19px;height:19px;}
  nav.bottom button.active{background:var(--ink);color:#fff;}

  .view{display:none;}
  .view.active{display:block;}

  button.reset-btn{background:transparent;border:1.5px solid var(--bad-ink);color:var(--bad-ink);
    border-radius:var(--r-pill);padding:11px 12px;font-size:0.8rem;font-weight:700;cursor:pointer;
    width:100%;margin-top:6px;font-family:inherit;}

  /* poids hebdo */
  .weight-row{display:flex;gap:10px;align-items:center;}
  .weight-input-wrap{flex:1;display:flex;align-items:center;background:var(--surface-2);
    border-radius:var(--r-pill);padding:4px 4px 4px 14px;}
  .weight-input-wrap input{flex:1;min-width:0;border:none;background:transparent;font-family:inherit;
    font-size:0.95rem;font-weight:700;color:var(--ink);padding:8px 0;outline:none;}
  .weight-unit{color:var(--ink-dim);font-weight:700;font-size:0.8rem;padding-right:10px;white-space:nowrap;}
  .weight-save-btn{background:var(--ink);color:#fff;border:none;border-radius:var(--r-pill);
    padding:11px 16px;font-weight:800;font-size:0.82rem;cursor:pointer;font-family:inherit;white-space:nowrap;}
  .weight-delta{font-size:0.7rem;font-weight:800;padding:2px 8px;border-radius:999px;}
  .weight-delta.up{background:var(--bad-bg);color:var(--bad-ink);}
  .weight-delta.down{background:var(--ok-bg);color:var(--ok-ink);}
  .weight-delta.flat{background:var(--surface-2);color:var(--ink-dim);}
  .weight-summary{display:flex;align-items:center;gap:8px;margin-top:10px;}
  .weight-summary .wnum{font-size:1.3rem;font-weight:800;letter-spacing:-0.01em;}
  #weightChartWrap{margin-top:10px;}
  .weight-svg{width:100%;height:130px;display:block;}
</style>
</head>
<body>

<div class="wrap">

  <section id="view-programme" class="view">
    <div class="hero-stats" id="heroStats"></div>
    <div id="programmeList"></div>
  </section>

  <section id="view-seance" class="view">
    <div id="warnBanner"></div>
    <div class="segmented" id="sessionPicker"></div>
    <div class="muted" style="margin:-8px 0 14px 4px;">Fais les séries d'un exercice en entier (avec repos) avant de passer au suivant.</div>
    <div id="exerciseList"></div>
    <button class="finish-btn" id="finishBtn" disabled>Termine tous les exercices d'abord</button>
  </section>

  <section id="view-progression" class="view">
    <div class="stat-grid" id="statGrid"></div>
    <div class="card">
      <h2><span id="icScale"></span>Poids hebdo</h2>
      <div class="weight-row">
        <div class="weight-input-wrap">
          <input type="text" id="weightInput" inputmode="decimal" placeholder="ex. 65,5">
          <span class="weight-unit">kg</span>
        </div>
        <button class="weight-save-btn" id="weightSaveBtn">Enregistrer</button>
      </div>
      <div class="muted" id="weightWeekLabel" style="margin-top:8px;"></div>
      <div class="weight-summary" id="weightSummary"></div>
      <div id="weightChartWrap"></div>
    </div>
    <div class="card">
      <h2><span id="icBars"></span>Séances / semaine</h2>
      <div class="bars" id="barsChart"></div>
    </div>
    <div class="card">
      <h2><span id="icHistory"></span>Historique</h2>
      <div id="historyList"></div>
    </div>
    <button class="reset-btn" id="resetBtn">Réinitialiser toutes les données</button>
  </section>

</div>

<nav class="bottom">
  <button data-view="programme" class="navbtn"><span class="ic" id="navIcProgramme"></span>Programme</button>
  <button data-view="seance" class="navbtn"><span class="ic" id="navIcSeance"></span>Séance</button>
  <button data-view="progression" class="navbtn"><span class="ic" id="navIcProgression"></span>Progression</button>
</nav>

<script>
(function(){
"use strict";

/* ---------------------------------------------------------------
   ICÔNES (SVG inline, dessinées maison — style trait fin/plein)
--------------------------------------------------------------- */
const ICONS = {
  dumbbell: '<rect x="1.6" y="9" width="3" height="6" rx="1"/><rect x="19.4" y="9" width="3" height="6" rx="1"/><rect x="4.8" y="10.4" width="3.6" height="3.2" rx="0.6"/><rect x="15.6" y="10.4" width="3.6" height="3.2" rx="0.6"/><rect x="6.5" y="11.1" width="11" height="1.8" rx="0.9"/>',
  flag: '<line x1="6" y1="3" x2="6" y2="21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M7.6 4.6 L19 4.6 L15.8 8 L19 11.4 L7.6 11.4 Z"/>',
  flame: '<path d="M12 3c.8 2.4-.6 3.9-1.8 5.3C9 9.7 8 11.1 8 13a4 4 0 0 0 8 0c0-1.1-.3-2-.8-2.7-.2.7-.6 1.3-1.2 1.6.3-.8.2-1.7-.2-2.4-.7-1.2-1.6-2.2-1.8-3.5-.9 1-2 2-2 3.4 0 .5.1.9.4 1.3-.8-.5-1.3-1.3-1.4-2.2C8.8 6.9 10.4 4.9 12 3Z"/>',
  checkCircle: '<circle cx="12" cy="12" r="9.2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M8 12.3l2.6 2.6L16.3 9" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>',
  checkMark: '<polyline points="5,12.5 9.5,17 19,7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>',
  alert: '<path d="M12 3.5 L21 19.5 L3 19.5 Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><line x1="12" y1="9.5" x2="12" y2="14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="12" cy="17" r="1" fill="currentColor"/>',
  calendar: '<rect x="3.5" y="5.5" width="17" height="15" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.8"/><line x1="3.5" y1="10" x2="20.5" y2="10" stroke="currentColor" stroke-width="1.8"/><line x1="8" y1="3.5" x2="8" y2="7.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><line x1="16" y1="3.5" x2="16" y2="7.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>',
  trending: '<polyline points="4,17 9,11 13,14 20,6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polyline points="14,6 20,6 20,12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>',
  target: '<circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="12" cy="12" r="5.3" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="12" cy="12" r="1.6"/>',
  clock: '<circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.8"/><line x1="12" y1="12" x2="12" y2="7.3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><line x1="12" y1="12" x2="15.5" y2="14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>',
  chevronsUp: '<polyline points="6,13.5 12,7.5 18,13.5" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/><polyline points="6,19 12,13 18,19" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/>',
  chevronsDown: '<polyline points="6,10.5 12,16.5 18,10.5" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/><polyline points="6,5 12,11 18,5" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/>',
  chevronsLeft: '<polyline points="13.5,6 7.5,12 13.5,18" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/><polyline points="19,6 13,12 19,18" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/>',
  folder: '<path d="M4 7.2c0-1 .8-1.8 1.8-1.8h3.6l1.6 1.8H18c1 0 1.8.8 1.8 1.8v9.2c0 1-.8 1.8-1.8 1.8H5.8c-1 0-1.8-.8-1.8-1.8V7.2Z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>',
  barChart: '<rect x="4" y="12" width="3.4" height="8" rx="1"/><rect x="10.3" y="6" width="3.4" height="14" rx="1"/><rect x="16.6" y="9" width="3.4" height="11" rx="1"/>',
  scale: '<rect x="3" y="3" width="18" height="18" rx="4" fill="none" stroke="currentColor" stroke-width="1.7"/><circle cx="12" cy="10.5" r="4.3" fill="none" stroke="currentColor" stroke-width="1.5"/><line x1="12" y1="10.5" x2="9.9" y2="8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>',
  thumbsUp: '<rect x="2" y="10" width="4.2" height="10" rx="1.2"/><rect x="7.8" y="10" width="10.7" height="10" rx="2.6"/><path d="M9.3 10c-.3-1.8-.5-4.3.6-6 .8-1.2 2.5-1 2.9.4.4 1.5-.1 3.9-.8 5.6Z"/>',
  bolt: '<path d="M13 2 4 14h6l-1 8 9-12h-6Z"/>',
};
function icon(name){
  return `<svg class="icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">${ICONS[name]||''}</svg>`;
}
function mountStaticIcons(){
  document.getElementById('navIcProgramme').innerHTML = icon('calendar');
  document.getElementById('navIcSeance').innerHTML = icon('dumbbell');
  document.getElementById('navIcProgression').innerHTML = icon('trending');
  document.getElementById('icBars').innerHTML = icon('barChart');
  document.getElementById('icHistory').innerHTML = icon('folder');
  document.getElementById('icScale').innerHTML = icon('scale');
}

/* ---------------------------------------------------------------
   DONNÉES DU PROGRAMME
   Dates de courses approximatives (à ajuster si besoin) :
   - Paris-Versailles 16K : 2026-09-27
   - 20K Paris            : 2026-10-25
   - 10K Hoka             : 2026-11-15
--------------------------------------------------------------- */
const START_DATE = '2026-08-31'; // Lundi, début semaine 1
const RACES = [
  { name:'Paris-Versailles 16K', date:'2026-09-27' },
  { name:'20K Paris',            date:'2026-10-25' },
  { name:'10K Hoka',             date:'2026-11-15' },
];
const REST_SECONDS = 45;
const MONTHS_FR = ['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'];

const EXERCISES = {
  pompes:   { name:'Pompes', group:'Poitrine / Triceps', type:'reps', unit:'reps',
              variants:['Pompes mains surélevées','Pompes genoux','Pompes standard','Pompes déclinées (pieds surélevés)'],
              startVariant:1, startTarget:8, minTarget:6, bumpCap:14, step:1 },
  pike:     { name:'Pike push-up', group:'Épaules', type:'reps', unit:'reps',
              variants:['Pike genoux fléchis','Pike standard','Pike pieds surélevés'],
              startVariant:0, startTarget:6, minTarget:5, bumpCap:12, step:1 },
  dips:     { name:'Dips sur chaise', group:'Triceps', type:'reps', unit:'reps',

const STORAGE_KEY = 'muscuPlanState_v1';

function defaultState(){
  return {
    startDate: START_DATE,
    log: [],            // {date, blockId, sessionType, results:[{exerciseId,difficulty}]}
    exerciseProgress: {},
    weights: {},         // { [weekNumber]: kg }
  };
}

let state = loadState();

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return defaultState();
    const parsed = JSON.parse(raw);
    return Object.assign(defaultState(), parsed);
  }catch(e){ return defaultState(); }
}
function saveState(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }

function getProgress(exId){
  if(!state.exerciseProgress[exId]){
    const def = EXERCISES[exId];
    state.exerciseProgress[exId] = {
      variantIndex: def.startVariant,
      target: def.startTarget,
      sets: 3,
      facileStreak: 0,
    };
  }
  return state.exerciseProgress[exId];
}

function applyBlockCaps(block){
  Object.keys(block.sessions).forEach(type=>{
    block.sessions[type].forEach(entry=>{
      const p = getProgress(entry.id);
      if(entry.sets > p.sets) p.sets = entry.sets;
      p._maxVariant = entry.maxVariant; // live cap for current context
    });
  });
}

/* ---------------------------------------------------------------
   DATE / BLOC HELPERS
--------------------------------------------------------------- */
function daysBetween(a,b){
  const MS=86400000;
  return Math.floor((new Date(b+'T00:00:00') - new Date(a+'T00:00:00'))/MS);
}
function toISODate(d){
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function todayStr(){
  return toISODate(new Date());
}
function currentWeekNumber(){
  const diff = daysBetween(state.startDate, todayStr());
  return Math.min(16, Math.max(1, Math.floor(diff/7)+1));
}
function blockForWeek(w){
  return BLOCKS.find(b=>b.weeks.includes(w)) || BLOCKS[0];
}
function blockIndex(id){ return BLOCKS.findIndex(b=>b.id===id); }

function nextRace(){
  const t = todayStr();
  const upcoming = RACES.filter(r=>daysBetween(t,r.date) >= 0).sort((a,b)=>daysBetween(t,a.date)-daysBetween(t,b.date));
  return upcoming[0] || null;
}
function weekOfDate(dateStr){
  const diff = daysBetween(state.startDate, dateStr);
  return Math.min(16, Math.max(1, Math.floor(diff/7)+1));
}
function addDays(iso, n){
  const d = new Date(iso+'T00:00:00');
  d.setDate(d.getDate()+n);
  return toISODate(d);
}
function fmtDDMM(iso){
  const d = new Date(iso+'T00:00:00');
  return `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}`;
}
function fmtLong(iso){
  const d = new Date(iso+'T00:00:00');
  return `${d.getDate()} ${MONTHS_FR[d.getMonth()]}`;
}
function weekRange(weekNum){
  const start = addDays(state.startDate, (weekNum-1)*7);
  const end = addDays(start, 6);
  return { start, end, label: `${fmtDDMM(start)} au ${fmtDDMM(end)}` };
}

function renderExerciseList(){
  const block = getActiveBlock();

  const sty = SESSION_STYLE[currentSessionType];

    const prog = getProgress(entry.id);
    const maxV = entry.maxVariant;
    const variantLabel = def.variants[Math.min(prog.variantIndex, maxV)];
    const done = !!(sessionResults[entry.id] && sessionResults[entry.id].difficulty);

    const card = document.createElement('div');
    card.className = 'exercise' + (done?' done':'');
    const targetLabel = `${prog.sets} séries × ${prog.target} ${def.unit}`;

    card.innerHTML = `
      <div class="ex-head">
        <span class="ex-icon" style="background:${sty.bg};color:${sty.ink}">${icon(SESSION_ICON_KEY[currentSessionType])}</span>
        <div class="ex-info">
          <div class="ex-name">${def.name}</div>
          <div class="ex-group">${def.group} · ${variantLabel}</div>
        </div>
        ${done ? `<div class="ex-check">${icon('checkMark')}</div>` : ''}
      </div>
      <div class="ex-target-row">
        <span class="ex-target-badge">${icon('target')}<span>${targetLabel}</span></span>
        <button class="ex-target-badge rest-btn" data-rest="${entry.id}">${icon('clock')}<span>Repos ${REST_SECONDS}s</span></button>
      </div>
      <div class="set-row">
        <div class="set-dots" data-ex="${entry.id}"></div>
        ${def.type==='hold' ? `<button class="timer-btn" data-timer="${entry.id}">${icon('clock')}<span>${prog.target}s</span></button>` : ''}
      </div>
      <div class="diff-row" data-diff="${entry.id}">
        <button class="diff-btn diff-facile" data-d="facile"><span class="diff-ic">${icon('checkCircle')}</span><span>Facile</span></button>
        <button class="diff-btn diff-parfait" data-d="parfait"><span class="diff-ic">${icon('thumbsUp')}</span><span>Parfait</span></button>
        <button class="diff-btn diff-dur" data-d="dur"><span class="diff-ic">${icon('bolt')}</span><span>Dur</span></button>
      </div>
    `;
    container.appendChild(card);

    const dotsWrap = card.querySelector('.set-dots');
    let setsDone = (sessionResults[entry.id] && sessionResults[entry.id].setsDone) || 0;
    for(let i=0;i<prog.sets;i++){
      const dot = document.createElement('div');
      dot.className='dot' + (i<setsDone?' filled':'');
      dot.textContent = i+1;
      dot.onclick = ()=>{
        setsDone = (i+1===setsDone) ? i : i+1;
        if(!sessionResults[entry.id]) sessionResults[entry.id]={setsDone:0,difficulty:null};
        sessionResults[entry.id].setsDone = setsDone;
        renderExerciseList();
      };
      dotsWrap.appendChild(dot);
    }

    const diffBtns = card.querySelectorAll(`[data-diff="${entry.id}"] .diff-btn`);
    diffBtns.forEach(b=>{
      if(sessionResults[entry.id] && sessionResults[entry.id].difficulty===b.dataset.d){
        b.classList.add('picked');
      }
      b.onclick = ()=>{
        if(!sessionResults[entry.id]) sessionResults[entry.id]={setsDone:prog.sets,difficulty:null};
        sessionResults[entry.id].difficulty = b.dataset.d;
        if(sessionResults[entry.id].setsDone < 1) sessionResults[entry.id].setsDone = prog.sets;
        applyDifficulty(entry.id, b.dataset.d, maxV);
        renderExerciseList();
        updateFinishBtn();
      };
    });

    if(def.type==='hold'){
      const timerBtn = card.querySelector(`[data-timer="${entry.id}"]`);
      timerBtn.onclick = ()=> startCountdown(prog.target, timerBtn);
    }
    const restBtn = card.querySelector(`[data-rest="${entry.id}"]`);
    restBtn.onclick = ()=> startCountdown(REST_SECONDS, restBtn);
  });

  updateFinishBtn();
}

function startCountdown(seconds, btn){
  const label = btn.querySelector('span');
  const original = label.textContent;
  let remaining = seconds;
  btn.disabled = true;
  label.textContent = remaining+'s';
  const iv = setInterval(()=>{
    remaining--;
    label.textContent = remaining>0 ? remaining+'s' : '✔';
    if(remaining<=0){
      clearInterval(iv);
      beep();
      setTimeout(()=>{ label.textContent = original; btn.disabled = false; }, 600);
    }
  },1000);
}

function beep(){
  try{
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.type='sine'; o.frequency.value=880;
    o.connect(g); g.connect(ctx.destination);
    g.gain.setValueAtTime(0.15, ctx.currentTime);
    o.start();
    o.stop(ctx.currentTime+0.25);
  }catch(e){}
}

function applyDifficulty(exId, difficulty, maxVariant){
  const def = EXERCISES[exId];
  const p = getProgress(exId);
  if(difficulty==='dur'){
    p.target = Math.max(def.minTarget, p.target - def.step);
    p.facileStreak = 0;
  } else if(difficulty==='parfait'){
    p.facileStreak = 0;
  } else if(difficulty==='facile'){
    p.facileStreak++;
    if(p.facileStreak>=2){
      if(p.target + def.step <= def.bumpCap){
        p.target += def.step;
      } else if(p.variantIndex < maxVariant){
        p.variantIndex++;
        p.target = def.startTarget;
      } else {
        p.sets = Math.min(p.sets+1, 5);
      }
      p.facileStreak = 0;
    }
  }
}

function updateFinishBtn(){
  const block = getActiveBlock();
  const entries = block.sessions[currentSessionType];
  const allDone = entries.every(e=> sessionResults[e.id] && sessionResults[e.id].difficulty);
  const btn = document.getElementById('finishBtn');
  btn.disabled = !allDone;
  btn.innerHTML = allDone
    ? `${icon('checkMark')}<span>Terminer la séance</span>`
    : `<span>Note la difficulté de chaque exercice (${Object.values(sessionResults).filter(r=>r.difficulty).length}/${entries.length})</span>`;
}

document.getElementById('finishBtn').addEventListener('click', ()=>{
  const block = getActiveBlock();
  const entries = block.sessions[currentSessionType];
  const results = entries.map(e=>({
    exerciseId: e.id,
    difficulty: sessionResults[e.id] ? sessionResults[e.id].difficulty : null,
  }));
  state.log.push({
    date: todayStr(),
    blockId: block.id,
    sessionType: currentSessionType,
    results,
  });
  saveState();
  sessionResults = {};
  renderHeader();
  renderExerciseList();
  renderProgression();
  switchView('progression');
});

    row.className='hist-item';
    row.innerHTML = `
      <span class="hist-dot" style="background:${sty.ink}"></span>
      <span class="d1">${l.date}</span>
      <span class="d2">${l.sessionType} · ${block?block.name:''} <span class="hist-diffs">${diffSummary}</span></span>`;
    list.appendChild(row);
  });
}

function renderWeightCard(){
  const w = currentWeekNumber();
  document.getElementById('weightWeekLabel').textContent = `Semaine ${w} · ${weekRange(w).label}`;
  const input = document.getElementById('weightInput');
  if(document.activeElement !== input){
    input.value = state.weights[w] != null ? String(state.weights[w]).replace('.', ',') : '';
  }

  renderWeightSummary();
  renderWeightChart();
}

function renderWeightSummary(){
  const summary = document.getElementById('weightSummary');
  const weeks = Object.keys(state.weights).map(Number).sort((a,b)=>a-b);
  if(weeks.length===0){ summary.innerHTML = ''; return; }
  const last = weeks[weeks.length-1];
  const prev = weeks[weeks.length-2];
  const lastVal = state.weights[last];
  let deltaHtml = '';
  if(prev!=null){
    const d = Math.round((lastVal - state.weights[prev])*10)/10;
    const cls = d>0.05?'up':(d<-0.05?'down':'flat');
    const sign = d>0?'+':'';
    deltaHtml = `<span class="weight-delta ${cls}">${sign}${String(d).replace('.', ',')} kg</span>`;
  }
  summary.innerHTML = `<span class="wnum">${String(lastVal).replace('.', ',')} kg</span>${deltaHtml}<span class="muted">dernière pesée (S${last})</span>`;
}

function renderWeightChart(){
  const wrap = document.getElementById('weightChartWrap');
  const weeks = Object.keys(state.weights).map(Number).sort((a,b)=>a-b);
  if(weeks.length===0){
    wrap.innerHTML = '<div class="muted">Ajoute une pesée pour voir la courbe.</div>';
    return;
  }
  const vals = weeks.map(w=>state.weights[w]);
  if(weeks.length===1){
    wrap.innerHTML = `<div class="muted">Ajoute une 2ᵉ pesée la semaine prochaine pour voir la courbe démarrer.</div>`;
    return;
  }
  const min = Math.min(...vals), max = Math.max(...vals);
  const pad = Math.max(0.6, (max-min)*0.3);
  const yMin = min-pad, yMax = max+pad;
  const W=300, H=130, padL=10, padR=10, padT=18, padB=20;
  const innerW=W-padL-padR, innerH=H-padT-padB;
  const xFor = i => padL + (i/(weeks.length-1))*innerW;
  const yFor = v => padT + innerH - ((v-yMin)/(yMax-yMin))*innerH;
  const pts = weeks.map((w,i)=>({x:xFor(i), y:yFor(vals[i]), w, v:vals[i]}));
  const line = pts.map((p,i)=>(i===0?'M':'L')+p.x.toFixed(1)+','+p.y.toFixed(1)).join(' ');
  const area = line + ` L${pts[pts.length-1].x.toFixed(1)},${(padT+innerH).toFixed(1)} L${pts[0].x.toFixed(1)},${(padT+innerH).toFixed(1)} Z`;
  const dots = pts.map(p=>`<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="3.4" fill="var(--accent-ink)" stroke="var(--surface)" stroke-width="1.6"/>`).join('');
  const wkLabels = pts.map(p=>`<text x="${p.x.toFixed(1)}" y="${H-4}" font-size="8" text-anchor="middle" fill="var(--ink-dim)">S${p.w}</text>`).join('');
  const last = pts[pts.length-1];
  const lastLbl = `<text x="${Math.min(Math.max(last.x,20),W-20).toFixed(1)}" y="${Math.max(last.y-8,10).toFixed(1)}" font-size="9" font-weight="800" text-anchor="middle" fill="var(--ink)">${String(last.v).replace('.', ',')} kg</text>`;

  wrap.innerHTML = `<svg viewBox="0 0 ${W} ${H}" class="weight-svg" preserveAspectRatio="none">
    <path d="${area}" fill="var(--accent)" opacity="0.18"/>
    <path d="${line}" fill="none" stroke="var(--accent-ink)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    ${dots}
    ${wkLabels}
    ${lastLbl}
  </svg>`;
}

document.getElementById('weightSaveBtn').addEventListener('click', ()=>{
  const input = document.getElementById('weightInput');
  const raw = input.value.replace(',', '.').trim();
  const val = parseFloat(raw);
  if(!raw || isNaN(val) || val<=0 || val>250){ input.focus(); return; }
  state.weights[currentWeekNumber()] = Math.round(val*10)/10;
  saveState();
  renderWeightCard();
});

function renderProgression(){
  renderStatGrid();
  renderWeightCard();
  renderBars();
  renderHistory();
}

document.getElementById('resetBtn').addEventListener('click', ()=>{
  if(confirm('Réinitialiser tout le programme et l\'historique ? Cette action est irréversible.')){
    state = defaultState();
    saveState();
    renderAll();
  }
});

/* ---------------------------------------------------------------
   NAVIGATION
--------------------------------------------------------------- */
function switchView(name){
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.getElementById('view-'+name).classList.add('active');
  document.querySelectorAll('.navbtn').forEach(b=>b.classList.toggle('active', b.dataset.view===name));
  if(name==='seance') renderSeanceView();
  if(name==='progression') renderProgression();
  if(name==='programme') renderProgramme();
}
document.querySelectorAll('.navbtn').forEach(b=>{
  b.addEventListener('click', ()=> switchView(b.dataset.view));
});

function renderAll(){
  mountStaticIcons();
  renderHeader();
  renderProgramme();
  renderProgression();
  switchView('programme');
}

renderAll();

})();
</script>
