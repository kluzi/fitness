<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Muscu Plan — 16 semaines</title>
<style>
  :root{
    --bg:#0f1220;
    --bg-card:#1a1e33;
    --bg-card-2:#212747;
    --accent:#ff5f6d;
    --accent2:#ffc93c;
    --accent3:#4fd1c5;
    --accent4:#6c8cff;
    --text:#f4f5fb;
    --text-dim:#9aa0c3;
    --ok:#4fd1c5;
    --warn:#ffc93c;
    --bad:#ff5f6d;
    --radius:16px;
    font-size:16px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
  body{
    padding-bottom:84px;
    background:
      radial-gradient(circle at 15% 0%, rgba(255,95,109,0.25), transparent 45%),
      radial-gradient(circle at 90% 10%, rgba(108,140,255,0.2), transparent 40%),
      var(--bg);
    min-height:100vh;
  }
  .wrap{max-width:560px;margin:0 auto;padding:16px 14px 8px;}
  header.top{padding:18px 16px 10px;max-width:560px;margin:0 auto;}
  header.top h1{font-size:1.3rem;margin:0 0 2px;display:flex;align-items:center;gap:8px;}
  header.top .sub{color:var(--text-dim);font-size:0.85rem;}
  .pill-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;}
  .pill{background:var(--bg-card);border:1px solid rgba(255,255,255,0.06);border-radius:999px;padding:6px 12px;font-size:0.78rem;color:var(--text-dim);display:flex;align-items:center;gap:6px;}
  .pill b{color:var(--text);}
  .card{background:var(--bg-card);border-radius:var(--radius);padding:16px;margin-bottom:14px;border:1px solid rgba(255,255,255,0.05);}
  .card h2{font-size:1.05rem;margin:0 0 10px;display:flex;align-items:center;gap:8px;}
  .card h3{font-size:0.95rem;margin:0 0 6px;color:var(--text);}
  .muted{color:var(--text-dim);font-size:0.85rem;}
  .block-card{border-left:4px solid var(--accent4);}
  .block-card.active{border-left:4px solid var(--accent2);box-shadow:0 0 0 1px rgba(255,201,60,0.3);}
  .block-card.done{border-left:4px solid var(--ok);opacity:0.75;}
  .block-header{display:flex;justify-content:space-between;align-items:center;cursor:pointer;}
  .badge-status{font-size:0.7rem;padding:3px 8px;border-radius:999px;background:rgba(255,255,255,0.08);}
  .badge-status.active{background:rgba(255,201,60,0.2);color:var(--accent2);}
  .badge-status.done{background:rgba(79,209,197,0.2);color:var(--ok);}
  .session-mini{display:flex;justify-content:space-between;padding:8px 0;border-top:1px solid rgba(255,255,255,0.06);font-size:0.85rem;}
  .session-mini:first-of-type{border-top:none;}
  .session-tag{display:inline-block;width:22px;height:22px;border-radius:6px;text-align:center;line-height:22px;font-size:0.75rem;font-weight:700;margin-right:8px;}
  .tag-A{background:rgba(255,95,109,0.25);color:var(--accent);}
  .tag-B{background:rgba(79,209,197,0.25);color:var(--accent3);}
  .tag-C{background:rgba(108,140,255,0.25);color:var(--accent4);}

  .session-picker{display:flex;gap:8px;margin-bottom:14px;}
  .session-btn{flex:1;background:var(--bg-card);border:2px solid transparent;border-radius:var(--radius);padding:12px 8px;text-align:center;color:var(--text);cursor:pointer;font-size:0.85rem;}
  .session-btn .big{font-size:1.4rem;display:block;margin-bottom:4px;}
  .session-btn.sel-A{border-color:var(--accent);}
  .session-btn.sel-B{border-color:var(--accent3);}
  .session-btn.sel-C{border-color:var(--accent4);}

  .warn-banner{background:rgba(255,201,60,0.15);border:1px solid rgba(255,201,60,0.4);color:var(--accent2);border-radius:12px;padding:10px 12px;font-size:0.82rem;margin-bottom:14px;}

  .exercise{background:var(--bg-card);border-radius:var(--radius);padding:14px;margin-bottom:12px;border:1px solid rgba(255,255,255,0.05);}
  .exercise.done{opacity:0.55;}
  .exercise .ex-head{display:flex;justify-content:space-between;align-items:flex-start;}
  .exercise .ex-name{font-weight:700;font-size:1rem;}
  .exercise .ex-group{color:var(--text-dim);font-size:0.75rem;}
  .exercise .ex-target{font-size:0.85rem;color:var(--accent2);margin-top:4px;}
  .check-mark{font-size:1.3rem;}
  .set-row{display:flex;align-items:center;gap:10px;margin-top:12px;}
  .set-dots{display:flex;gap:6px;flex:1;}
  .dot{width:26px;height:26px;border-radius:8px;background:rgba(255,255,255,0.08);display:flex;align-items:center;justify-content:center;font-size:0.7rem;color:var(--text-dim);cursor:pointer;user-select:none;}
  .dot.filled{background:var(--accent4);color:#fff;}
  .timer-btn{background:var(--accent4);border:none;color:#fff;border-radius:10px;padding:8px 12px;font-size:0.85rem;cursor:pointer;white-space:nowrap;}
  .timer-display{font-variant-numeric:tabular-nums;font-weight:700;font-size:1.1rem;margin-left:6px;}
  .diff-row{display:flex;gap:8px;margin-top:12px;}
  .diff-btn{flex:1;border:none;border-radius:10px;padding:9px 4px;font-size:0.78rem;cursor:pointer;color:#111;font-weight:600;}
  .diff-facile{background:var(--ok);}
  .diff-parfait{background:var(--accent2);}
  .diff-dur{background:var(--accent);color:#fff;}
  .diff-btn.picked{outline:3px solid rgba(255,255,255,0.6);}

  .finish-btn{width:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border:none;color:#111;font-weight:700;padding:14px;border-radius:var(--radius);font-size:1rem;cursor:pointer;margin-top:6px;}
  .finish-btn:disabled{opacity:0.4;cursor:not-allowed;}

  .stat-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:14px;}
  .stat-box{background:var(--bg-card);border-radius:14px;padding:12px 8px;text-align:center;}
  .stat-box .num{font-size:1.4rem;font-weight:800;color:var(--accent2);}
  .stat-box .lbl{font-size:0.7rem;color:var(--text-dim);}

  .bars{display:flex;align-items:flex-end;gap:6px;height:110px;margin:10px 0 4px;}
  .bar-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;}
  .bar{width:100%;border-radius:6px 6px 0 0;background:linear-gradient(180deg,var(--accent4),var(--accent3));min-height:4px;}
  .bar-lbl{font-size:0.6rem;color:var(--text-dim);margin-top:4px;}

  .badges{display:flex;flex-wrap:wrap;gap:8px;}
  .badge{background:var(--bg-card-2);border-radius:12px;padding:10px;text-align:center;width:76px;font-size:0.65rem;color:var(--text-dim);}
  .badge.unlocked{color:var(--text);box-shadow:0 0 0 2px var(--accent2) inset;}
  .badge .ic{font-size:1.6rem;display:block;margin-bottom:4px;filter:grayscale(1);opacity:0.4;}
  .badge.unlocked .ic{filter:none;opacity:1;}

  .hist-item{display:flex;justify-content:space-between;padding:9px 0;border-top:1px solid rgba(255,255,255,0.06);font-size:0.82rem;}
  .hist-item:first-child{border-top:none;}
  .hist-item .d1{color:var(--text-dim);}

  nav.bottom{position:fixed;bottom:0;left:0;right:0;background:rgba(15,18,32,0.95);backdrop-filter:blur(8px);border-top:1px solid rgba(255,255,255,0.08);display:flex;z-index:50;}
  nav.bottom button{flex:1;background:none;border:none;color:var(--text-dim);padding:10px 4px 8px;font-size:0.7rem;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;}
  nav.bottom button .ic{font-size:1.3rem;}
  nav.bottom button.active{color:var(--accent2);}

  .view{display:none;}
  .view.active{display:block;}

  select.block-select, select.session-select-week{background:var(--bg-card);color:var(--text);border:1px solid rgba(255,255,255,0.1);border-radius:10px;padding:8px 10px;font-size:0.85rem;width:100%;margin-bottom:10px;}
  button.reset-btn{background:none;border:1px solid rgba(255,95,109,0.4);color:var(--accent);border-radius:10px;padding:8px 12px;font-size:0.78rem;cursor:pointer;width:100%;margin-top:6px;}
</style>
</head>
<body>

<header class="top">
  <h1>💪 Muscu Plan</h1>
  <div class="sub" id="headerSub">—</div>
  <div class="pill-row" id="headerPills"></div>
</header>

<div class="wrap">

  <section id="view-programme" class="view">
    <div id="programmeList"></div>
  </section>

  <section id="view-seance" class="view">
    <div id="warnBanner"></div>
    <div class="session-picker" id="sessionPicker"></div>
    <div id="exerciseList"></div>
    <button class="finish-btn" id="finishBtn" disabled>Termine tous les exercices d'abord</button>
  </section>

  <section id="view-progression" class="view">
    <div class="stat-grid" id="statGrid"></div>
    <div class="card">
      <h2>📊 Séances / semaine (8 dernières)</h2>
      <div class="bars" id="barsChart"></div>
    </div>
    <div class="card">
      <h2>🏅 Badges</h2>
      <div class="badges" id="badgesRow"></div>
    </div>
    <div class="card">
      <h2>🗂️ Historique</h2>
      <div id="historyList"></div>
    </div>
    <button class="reset-btn" id="resetBtn">Réinitialiser toutes les données</button>
  </section>

</div>

<nav class="bottom">
  <button data-view="programme" class="navbtn"><span class="ic">📅</span>Programme</button>
  <button data-view="seance" class="navbtn"><span class="ic">🏋️</span>Séance</button>
  <button data-view="progression" class="navbtn"><span class="ic">📈</span>Progression</button>
</nav>

<script>
(function(){
"use strict";

/* ---------------------------------------------------------------
   DONNÉES DU PROGRAMME
   Dates de courses approximatives (à ajuster si besoin) :
   - Paris-Versailles 16K : 2026-09-27
   - 20K Paris            : 2026-10-25
   - 10K Hoka             : 2026-11-15
--------------------------------------------------------------- */
const START_DATE = '2026-08-31'; // Lundi, début semaine 1
const RACES = [
  { name:'Paris-Versailles 16K', date:'2026-09-27' },
  { name:'20K Paris',            date:'2026-10-25' },
  { name:'10K Hoka',             date:'2026-11-15' },
];

const EXERCISES = {
  pompes:   { name:'Pompes', group:'Poitrine / Triceps', type:'reps', unit:'reps',
              variants:['Pompes mains surélevées','Pompes genoux','Pompes standard','Pompes déclinées (pieds surélevés)'],
              startVariant:1, startTarget:8, minTarget:6, bumpCap:14, step:1 },
  pike:     { name:'Pike push-up', group:'Épaules', type:'reps', unit:'reps',
              variants:['Pike genoux fléchis','Pike standard','Pike pieds surélevés'],
              startVariant:0, startTarget:6, minTarget:5, bumpCap:12, step:1 },
  dips:     { name:'Dips sur chaise', group:'Triceps', type:'reps', unit:'reps',
              variants:['Dips jambes fléchies','Dips jambes tendues','Dips pieds surélevés'],
              startVariant:0, startTarget:8, minTarget:6, bumpCap:14, step:1 },
  planche:  { name:'Gainage planche', group:'Core', type:'hold', unit:'sec',
              variants:['Planche genoux','Planche standard','Planche + lever bras/jambe alterné'],
              startVariant:1, startTarget:20, minTarget:15, bumpCap:45, step:5 },
  rows:     { name:'Rows australiens', group:'Dos', type:'reps', unit:'reps',
              variants:['Rows table (angle facile)','Rows table (horizontal)','Rows pieds surélevés'],
              startVariant:0, startTarget:8, minTarget:6, bumpCap:14, step:1 },
  superman: { name:'Superman', group:'Dos / Lombaires', type:'hold', unit:'sec',
              variants:['Superman maintien simple','Superman alterné bras/jambe opposés','Superman + extension dynamique'],
              startVariant:0, startTarget:15, minTarget:10, bumpCap:35, step:5 },
  gainage_lat:{ name:'Gainage latéral', group:'Core (obliques)', type:'hold', unit:'sec / côté',
              variants:['Planche latérale genoux','Planche latérale standard','Planche latérale + rotation'],
              startVariant:0, startTarget:15, minTarget:10, bumpCap:35, step:5 },
  pont:     { name:'Pont fessier', group:'Fessiers / Chaîne postérieure', type:'reps', unit:'reps',
              variants:['Pont fessier basique','Pont fessier unilatéral','Pont fessier unilatéral tempo lent'],
              startVariant:0, startTarget:12, minTarget:10, bumpCap:20, step:2 },
  squat:    { name:'Squat tempo', group:'Jambes (quadriceps/fessiers)', type:'reps', unit:'reps',
              variants:['Squat chaise (assis-debout)','Squat tempo (3s descente)','Squat sumo tempo'],
              startVariant:1, startTarget:10, minTarget:8, bumpCap:18, step:2 },
  fente:    { name:'Fente statique', group:'Jambes (unilatéral)', type:'hold', unit:'sec / jambe',
              variants:['Fente statique appui mur','Fente statique libre'],
              startVariant:0, startTarget:15, minTarget:10, bumpCap:30, step:5 },
  mollets:  { name:'Montées mollets', group:'Mollets', type:'reps', unit:'reps',
              variants:['Montées mollets 2 jambes','Montées mollets unilatéral'],
              startVariant:0, startTarget:15, minTarget:12, bumpCap:25, step:3 },
  deadbug:  { name:'Dead bug', group:'Core (anti-extension)', type:'reps', unit:'reps / côté',
              variants:['Dead bug standard','Bird dog','Bird dog + pause 2s'],
              startVariant:0, startTarget:8, minTarget:6, bumpCap:14, step:1 },
};

function ex(id,sets,maxVariant){ return {id,sets,maxVariant}; }

const BLOCKS = [
  { id:'b1', name:'Fondations', weeks:[1,2,3,4],
    sessions:{
      A:[ex('pompes',3,2), ex('pike',3,1), ex('dips',3,1), ex('planche',3,1)],
      B:[ex('squat',3,1), ex('fente',3,0), ex('mollets',3,0), ex('deadbug',3,0)],
      C:[ex('rows',3,1), ex('superman',3,0), ex('gainage_lat',3,1), ex('pont',3,1)],
    }},
  { id:'b2', name:'Consolidation', weeks:[5,6,7,8],
    sessions:{
      A:[ex('pompes',3,3), ex('pike',3,2), ex('dips',4,1), ex('planche',3,2)],
      B:[ex('squat',3,1), ex('fente',3,1), ex('mollets',3,1), ex('deadbug',3,1)],
      C:[ex('rows',4,2), ex('superman',3,1), ex('gainage_lat',3,2), ex('pont',3,1)],
    }},
  { id:'b3', name:'Intensification', weeks:[9,10,11,12],
    sessions:{
      A:[ex('pompes',4,3), ex('pike',4,2), ex('dips',4,2), ex('planche',4,2)],
      B:[ex('squat',3,1), ex('fente',3,1), ex('mollets',3,1), ex('deadbug',3,2)],
      C:[ex('rows',4,2), ex('superman',4,2), ex('gainage_lat',4,2), ex('pont',4,2)],
    }},
  { id:'b4', name:'Poussée', weeks:[13,14,15,16],
    sessions:{
      A:[ex('pompes',4,3), ex('pike',4,2), ex('dips',4,2), ex('planche',4,2)],
      B:[ex('squat',4,1), ex('fente',4,1), ex('mollets',4,1), ex('deadbug',4,2)],
      C:[ex('rows',4,2), ex('superman',4,2), ex('gainage_lat',4,2), ex('pont',4,2)],
    }},
];

const SESSION_LABELS = {
  A:'Haut du corps (poussée)',
  B:'Jambes light + gainage',
  C:'Haut du corps (tirage) + full body',
};
const SESSION_ICONS = { A:'💥', B:'🦵', C:'🔙' };

const BADGE_DEFS = [
  { id:'b1', ic:'🥉', label:'Bloc 1', need:10 },
  { id:'b2', ic:'🥈', label:'Bloc 2', need:22 },
  { id:'b3', ic:'🥇', label:'Bloc 3', need:34 },
  { id:'b4', ic:'🏆', label:'Bloc 4', need:46 },
  { id:'streak4', ic:'🔥', label:'4 sem. suivies', need:null },
];

/* ---------------------------------------------------------------
   STATE / PERSISTENCE
--------------------------------------------------------------- */
const STORAGE_KEY = 'muscuPlanState_v1';

function defaultState(){
  return {
    startDate: START_DATE,
    log: [],            // {date, blockId, sessionType, results:[{exerciseId,difficulty}]}
    exerciseProgress: {},
    badges: {},
  };
}

let state = loadState();

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return defaultState();
    const parsed = JSON.parse(raw);
    return Object.assign(defaultState(), parsed);
  }catch(e){ return defaultState(); }
}
function saveState(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }

function getProgress(exId){
  if(!state.exerciseProgress[exId]){
    const def = EXERCISES[exId];
    state.exerciseProgress[exId] = {
      variantIndex: def.startVariant,
      target: def.startTarget,
      sets: 3,
      facileStreak: 0,
    };
  }
  return state.exerciseProgress[exId];
}

function applyBlockCaps(block){
  Object.keys(block.sessions).forEach(type=>{
    block.sessions[type].forEach(entry=>{
      const p = getProgress(entry.id);
      if(entry.sets > p.sets) p.sets = entry.sets;
      p._maxVariant = entry.maxVariant; // live cap for current context
    });
  });
}

/* ---------------------------------------------------------------
   DATE / BLOC HELPERS
--------------------------------------------------------------- */
function daysBetween(a,b){
  const MS=86400000;
  return Math.floor((new Date(b+'T00:00:00') - new Date(a+'T00:00:00'))/MS);
}
function todayStr(){
  const d = new Date();
  return d.toISOString().slice(0,10);
}
function currentWeekNumber(){
  const diff = daysBetween(state.startDate, todayStr());
  return Math.min(16, Math.max(1, Math.floor(diff/7)+1));
}
function blockForWeek(w){
  return BLOCKS.find(b=>b.weeks.includes(w)) || BLOCKS[0];
}
function blockIndex(id){ return BLOCKS.findIndex(b=>b.id===id); }

function nextRace(){
  const t = todayStr();
  const upcoming = RACES.filter(r=>daysBetween(t,r.date) >= 0).sort((a,b)=>daysBetween(t,a.date)-daysBetween(t,b.date));
  return upcoming[0] || null;
}

/* ---------------------------------------------------------------
   HEADER
--------------------------------------------------------------- */
function renderHeader(){
  const w = currentWeekNumber();
  const block = blockForWeek(w);
  document.getElementById('headerSub').textContent =
    `Semaine ${w}/16 — Bloc ${blockIndex(block.id)+1} : ${block.name}`;

  const pills = document.getElementById('headerPills');
  pills.innerHTML='';
  const race = nextRace();
  if(race){
    const d = daysBetween(todayStr(), race.date);
    const p = document.createElement('div');
    p.className='pill';
    p.innerHTML = `🏁 <b>${race.name}</b> dans ${d} j`;
    pills.appendChild(p);
  }
  const sessionsThisWeek = state.log.filter(l=>weekOfDate(l.date)===w).length;
  const p2 = document.createElement('div');
  p2.className='pill';
  p2.innerHTML = `✅ <b>${sessionsThisWeek}/3</b> séances cette semaine`;
  pills.appendChild(p2);
}
function weekOfDate(dateStr){
  const diff = daysBetween(state.startDate, dateStr);
  return Math.min(16, Math.max(1, Math.floor(diff/7)+1));
}

/* ---------------------------------------------------------------
   VUE PROGRAMME
--------------------------------------------------------------- */
function renderProgramme(){
  const list = document.getElementById('programmeList');
  list.innerHTML='';
  const curWeek = currentWeekNumber();
  const curBlock = blockForWeek(curWeek);

  BLOCKS.forEach((block,i)=>{
    const isActive = block.id===curBlock.id;
    const isDone = block.weeks[block.weeks.length-1] < curWeek && !isActive;
    const card = document.createElement('div');
    card.className = 'card block-card' + (isActive?' active':'') + (isDone?' done':'');
    const statusLabel = isActive ? 'En cours' : (isDone ? 'Terminé' : `S${block.weeks[0]}-${block.weeks[block.weeks.length-1]}`);
    const statusClass = isActive ? 'active' : (isDone?'done':'');
    card.innerHTML = `
      <div class="block-header">
        <h2>Bloc ${i+1} — ${block.name}</h2>
        <span class="badge-status ${statusClass}">${statusLabel}</span>
      </div>
      <div class="muted">Semaines ${block.weeks[0]} à ${block.weeks[block.weeks.length-1]}</div>
      <div id="sessions-${block.id}"></div>
    `;
    list.appendChild(card);
    const sessWrap = card.querySelector(`#sessions-${block.id}`);
    ['A','B','C'].forEach(type=>{
      const entries = block.sessions[type];
      const names = entries.map(e=>EXERCISES[e.id].name).join(', ');
      const row = document.createElement('div');
      row.className='session-mini';
      row.innerHTML = `<span><span class="session-tag tag-${type}">${type}</span>${SESSION_LABELS[type]}</span>`;
      sessWrap.appendChild(row);
      const sub = document.createElement('div');
      sub.className='muted';
      sub.style.paddingLeft='30px';
      sub.style.marginTop='-4px';
      sub.style.marginBottom='4px';
      sub.textContent = names;
      sessWrap.appendChild(sub);
    });
  });
}

/* ---------------------------------------------------------------
   VUE SÉANCE
--------------------------------------------------------------- */
let currentSessionType = 'A';
let sessionResults = {}; // exerciseId -> {difficulty, setsDone}

function getActiveBlock(){
  return blockForWeek(currentWeekNumber());
}

function renderSessionPicker(){
  const picker = document.getElementById('sessionPicker');
  picker.innerHTML='';
  ['A','B','C'].forEach(type=>{
    const btn = document.createElement('div');
    btn.className = 'session-btn' + (currentSessionType===type ? ' sel-'+type : '');
    btn.innerHTML = `<span class="big">${SESSION_ICONS[type]}</span>${type} · ${SESSION_LABELS[type].split(' ')[0]}`;
    btn.onclick = ()=>{ currentSessionType = type; sessionResults = {}; renderSeanceView(); };
    picker.appendChild(btn);
  });
}

function renderWarnBanner(){
  const el = document.getElementById('warnBanner');
  el.innerHTML='';
  if(currentSessionType!=='B') return;
  const race = nextRace();
  if(!race) return;
  const d = daysBetween(todayStr(), race.date);
  if(d>=0 && d<2){
    el.innerHTML = `<div class="warn-banner">⚠️ ${race.name} dans ${d===0?"aujourd'hui":d+" j"} — séance jambes déconseillée à moins de 48h d'une sortie clé. Privilégie une séance A ou C.</div>`;
  }
}

function renderExerciseList(){
  const block = getActiveBlock();
  applyBlockCaps(block);
  const container = document.getElementById('exerciseList');
  container.innerHTML='';
  const entries = block.sessions[currentSessionType];

  entries.forEach(entry=>{
    const def = EXERCISES[entry.id];
    const prog = getProgress(entry.id);
    const maxV = entry.maxVariant;
    const variantLabel = def.variants[Math.min(prog.variantIndex, maxV)];
    const done = !!sessionResults[entry.id];

    const card = document.createElement('div');
    card.className = 'exercise' + (done?' done':'');
    const targetLabel = def.type==='hold'
      ? `${prog.sets} séries × ${prog.target}${def.unit==='sec / jambe' || def.unit==='sec / côté' ? '' : ''} ${def.unit}`
      : `${prog.sets} séries × ${prog.target} ${def.unit}`;

    card.innerHTML = `
      <div class="ex-head">
        <div>
          <div class="ex-name">${def.name}</div>
          <div class="ex-group">${def.group} · ${variantLabel}</div>
          <div class="ex-target">🎯 ${targetLabel}</div>
        </div>
        <div class="check-mark">${done ? '✅' : ''}</div>
      </div>
      <div class="set-row">
        <div class="set-dots" data-ex="${entry.id}"></div>
        ${def.type==='hold' ? `<button class="timer-btn" data-timer="${entry.id}">⏱ ${prog.target}s</button><span class="timer-display" data-timerdisplay="${entry.id}"></span>` : ''}
      </div>
      <div class="diff-row" data-diff="${entry.id}">
        <button class="diff-btn diff-facile" data-d="facile">😌 Trop facile</button>
        <button class="diff-btn diff-parfait" data-d="parfait">👍 Parfait</button>
        <button class="diff-btn diff-dur" data-d="dur">😤 Trop dur</button>
      </div>
    `;
    container.appendChild(card);

    const dotsWrap = card.querySelector('.set-dots');
    let setsDone = (sessionResults[entry.id] && sessionResults[entry.id].setsDone) || 0;
    for(let i=0;i<prog.sets;i++){
      const dot = document.createElement('div');
      dot.className='dot' + (i<setsDone?' filled':'');
      dot.textContent = i+1;
      dot.onclick = ()=>{
        setsDone = (i+1===setsDone) ? i : i+1;
        if(!sessionResults[entry.id]) sessionResults[entry.id]={setsDone:0,difficulty:null};
        sessionResults[entry.id].setsDone = setsDone;
        renderExerciseList();
      };
      dotsWrap.appendChild(dot);
    }

    const diffBtns = card.querySelectorAll(`[data-diff="${entry.id}"] .diff-btn`);
    diffBtns.forEach(b=>{
      if(sessionResults[entry.id] && sessionResults[entry.id].difficulty===b.dataset.d){
        b.classList.add('picked');
      }
      b.onclick = ()=>{
        if(!sessionResults[entry.id]) sessionResults[entry.id]={setsDone:prog.sets,difficulty:null};
        sessionResults[entry.id].difficulty = b.dataset.d;
        if(sessionResults[entry.id].setsDone < 1) sessionResults[entry.id].setsDone = prog.sets;
        applyDifficulty(entry.id, b.dataset.d, maxV);
        renderExerciseList();
        updateFinishBtn();
      };
    });

    if(def.type==='hold'){
      const timerBtn = card.querySelector(`[data-timer="${entry.id}"]`);
      const timerDisplay = card.querySelector(`[data-timerdisplay="${entry.id}"]`);
      timerBtn.onclick = ()=> startHoldTimer(prog.target, timerBtn, timerDisplay);
    }
  });

  updateFinishBtn();
}

function startHoldTimer(seconds, btn, display){
  let remaining = seconds;
  btn.disabled = true;
  display.textContent = remaining+'s';
  const iv = setInterval(()=>{
    remaining--;
    display.textContent = remaining+'s';
    if(remaining<=0){
      clearInterval(iv);
      display.textContent = '✔';
      btn.disabled = false;
      beep();
    }
  },1000);
}

function beep(){
  try{
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.type='sine'; o.frequency.value=880;
    o.connect(g); g.connect(ctx.destination);
    g.gain.setValueAtTime(0.15, ctx.currentTime);
    o.start();
    o.stop(ctx.currentTime+0.25);
  }catch(e){}
}

function applyDifficulty(exId, difficulty, maxVariant){
  const def = EXERCISES[exId];
  const p = getProgress(exId);
  if(difficulty==='dur'){
    p.target = Math.max(def.minTarget, p.target - def.step);
    p.facileStreak = 0;
  } else if(difficulty==='parfait'){
    p.facileStreak = 0;
  } else if(difficulty==='facile'){
    p.facileStreak++;
    if(p.facileStreak>=2){
      if(p.target + def.step <= def.bumpCap){
        p.target += def.step;
      } else if(p.variantIndex < maxVariant){
        p.variantIndex++;
        p.target = def.startTarget;
      } else {
        p.sets = Math.min(p.sets+1, 5);
      }
      p.facileStreak = 0;
    }
  }
}

function updateFinishBtn(){
  const block = getActiveBlock();
  const entries = block.sessions[currentSessionType];
  const allDone = entries.every(e=> sessionResults[e.id] && sessionResults[e.id].difficulty);
  const btn = document.getElementById('finishBtn');
  btn.disabled = !allDone;
  btn.textContent = allDone ? '🎉 Terminer la séance' : `Termine tous les exercices d'abord (${Object.values(sessionResults).filter(r=>r.difficulty).length}/${entries.length})`;
}

document.getElementById('finishBtn').addEventListener('click', ()=>{
  const block = getActiveBlock();
  const entries = block.sessions[currentSessionType];
  const results = entries.map(e=>({
    exerciseId: e.id,
    difficulty: sessionResults[e.id] ? sessionResults[e.id].difficulty : null,
  }));
  state.log.push({
    date: todayStr(),
    blockId: block.id,
    sessionType: currentSessionType,
    results,
  });
  updateBadges();
  saveState();
  sessionResults = {};
  renderHeader();
  renderExerciseList();
  renderProgression();
  switchView('progression');
});

function renderSeanceView(){
  renderSessionPicker();
  renderWarnBanner();
  renderExerciseList();
}

/* ---------------------------------------------------------------
   VUE PROGRESSION
--------------------------------------------------------------- */
function updateBadges(){
  const countsByBlock = {};
  BLOCKS.forEach(b=> countsByBlock[b.id]=0);
  state.log.forEach(l=> countsByBlock[l.blockId] = (countsByBlock[l.blockId]||0)+1);

  BADGE_DEFS.forEach(bd=>{
    if(bd.need==null) return;
    const bid = bd.id;
    const total = BLOCKS.slice(0, blockIndex(bid)+1).reduce((acc,b)=> acc + (countsByBlock[b.id]||0), 0);
    if(total >= bd.need) state.badges[bd.id]=true;
  });

  // streak: 4 semaines consécutives avec >=3 séances
  const weeksMap = {};
  state.log.forEach(l=>{
    const w = weekOfDate(l.date);
    weeksMap[w] = (weeksMap[w]||0)+1;
  });
  const curW = currentWeekNumber();
  let streak = 0;
  for(let w=curW; w>=1; w--){
    if((weeksMap[w]||0) >= 3) streak++; else break;
  }
  if(streak>=4) state.badges['streak4']=true;
}

function renderStatGrid(){
  const grid = document.getElementById('statGrid');
  const total = state.log.length;
  const curW = currentWeekNumber();
  const weeksMap = {};
  state.log.forEach(l=>{ const w=weekOfDate(l.date); weeksMap[w]=(weeksMap[w]||0)+1; });
  let streak = 0;
  for(let w=curW; w>=1; w--){ if((weeksMap[w]||0)>=3) streak++; else break; }
  const thisWeek = weeksMap[curW] || 0;

  grid.innerHTML = `
    <div class="stat-box"><div class="num">${total}</div><div class="lbl">Séances totales</div></div>
    <div class="stat-box"><div class="num">${thisWeek}/3</div><div class="lbl">Cette semaine</div></div>
    <div class="stat-box"><div class="num">${streak}</div><div class="lbl">Semaines à 3/3 d'affilée</div></div>
  `;
}

function renderBars(){
  const chart = document.getElementById('barsChart');
  chart.innerHTML='';
  const curW = currentWeekNumber();
  const weeksMap = {};
  state.log.forEach(l=>{ const w=weekOfDate(l.date); weeksMap[w]=(weeksMap[w]||0)+1; });
  const startW = Math.max(1, curW-7);
  for(let w=startW; w<=curW; w++){
    const count = weeksMap[w] || 0;
    const pct = Math.min(100, (count/4)*100);
    const col = document.createElement('div');
    col.className='bar-col';
    col.innerHTML = `<div class="bar" style="height:${Math.max(pct,3)}%"></div><div class="bar-lbl">S${w}</div>`;
    chart.appendChild(col);
  }
}

function renderBadges(){
  const row = document.getElementById('badgesRow');
  row.innerHTML='';
  BADGE_DEFS.forEach(bd=>{
    const unlocked = !!state.badges[bd.id];
    const el = document.createElement('div');
    el.className = 'badge' + (unlocked?' unlocked':'');
    el.innerHTML = `<span class="ic">${bd.ic}</span>${bd.label}`;
    row.appendChild(el);
  });
}

function renderHistory(){
  const list = document.getElementById('historyList');
  list.innerHTML='';
  const sorted = [...state.log].sort((a,b)=> b.date.localeCompare(a.date));
  if(sorted.length===0){
    list.innerHTML = '<div class="muted">Aucune séance enregistrée pour l\'instant.</div>';
    return;
  }
  sorted.slice(0,30).forEach(l=>{
    const block = BLOCKS.find(b=>b.id===l.blockId);
    const diffSummary = l.results.map(r=> r.difficulty==='facile'?'😌':r.difficulty==='dur'?'😤':'👍').join(' ');
    const row = document.createElement('div');
    row.className='hist-item';
    row.innerHTML = `<span class="d1">${l.date}</span><span><span class="session-tag tag-${l.sessionType}">${l.sessionType}</span>${block?block.name:''} — ${diffSummary}</span>`;
    list.appendChild(row);
  });
}

function renderProgression(){
  updateBadges();
  renderStatGrid();
  renderBars();
  renderBadges();
  renderHistory();
}

document.getElementById('resetBtn').addEventListener('click', ()=>{
  if(confirm('Réinitialiser tout le programme et l\'historique ? Cette action est irréversible.')){
    state = defaultState();
    saveState();
    renderAll();
  }
});

/* ---------------------------------------------------------------
   NAVIGATION
--------------------------------------------------------------- */
function switchView(name){
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.getElementById('view-'+name).classList.add('active');
  document.querySelectorAll('.navbtn').forEach(b=>b.classList.toggle('active', b.dataset.view===name));
  if(name==='seance') renderSeanceView();
  if(name==='progression') renderProgression();
  if(name==='programme') renderProgramme();
}
document.querySelectorAll('.navbtn').forEach(b=>{
  b.addEventListener('click', ()=> switchView(b.dataset.view));
});

function renderAll(){
  renderHeader();
  renderProgramme();
  renderProgression();
  switchView('programme');
}

renderAll();

})();
</script>
